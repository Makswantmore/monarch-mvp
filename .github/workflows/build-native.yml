name: Build Native Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Flutter SDK
        run: |
          sudo rm -rf /opt/flutter
          git clone --branch stable --depth 1 --single-branch https://github.com/flutter/flutter.git /opt/flutter
          /opt/flutter/bin/flutter config --no-analytics
          /opt/flutter/bin/flutter --version

      - name: Accept Android licenses
        run: yes | /opt/flutter/bin/flutter doctor --android-licenses || true

      - name: Get dependencies
        run: /opt/flutter/bin/flutter pub get

      - name: Build Android debug APK
        run: /opt/flutter/bin/flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        shell: pwsh
        run: |
          if (Test-Path C:\flutter) {
            Remove-Item -Recurse -Force C:\flutter
          }

          git clone --branch stable --depth 1 --single-branch https://github.com/flutter/flutter.git C:\flutter

          & 'C:\flutter\bin\flutter.bat' config --no-analytics
          & 'C:\flutter\bin\flutter.bat' --version

      - name: Get dependencies
        shell: pwsh
        run: |
          & 'C:\flutter\bin\flutter.bat' pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          & 'C:\flutter\bin\flutter.bat' build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path build\windows -Recurse -Filter *.exe | Select-Object -First 1

          if (-not $exe) {
            throw "No .exe file found in build\windows"
          }

          $releaseDir = $exe.DirectoryName

          if (Test-Path monarch-windows.zip) {
            Remove-Item monarch-windows.zip -Force
          }

          Compress-Archive -Path "$releaseDir\*" -DestinationPath monarch-windows.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: monarch-windows.zip